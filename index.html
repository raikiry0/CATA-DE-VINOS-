<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinta Roja · Planilla de Cata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1E4D3;
    --bg-paper: #F8EFE3;
    --card: #FBF4EA;
    --wine-900: #431022;
    --wine-800: #591830;
    --wine-700: #6E1F3A;
    --wine-600: #832A47;
    --wine-500: #9B3D4A;
    --gold: #B08D57;
    --gold-light: #D9C29A;
    --text: #3A1420;
    --text-muted: #93747B;
    --border: #E4CDB4;
    --stamp-1: #E7C3AE; /* Aceptable */
    --stamp-2: #CF8C6E; /* Bueno */
    --stamp-3: #A4445B; /* Muy Bueno */
    --stamp-4: #6E1F3A; /* Excelente */
    --ok-bg: #EFE3D3;
    --shadow: 0 1px 2px rgba(67,16,34,0.06), 0 8px 24px -12px rgba(67,16,34,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #F8EEDF 0%, transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, #F3E4CF 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Lora', Georgia, serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 90px;}
  header.top{
    display:flex;align-items:center;gap:14px;margin-bottom:18px;
  }
  .glass-mark{width:46px;height:56px;flex:0 0 auto;}
  h1.brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.2px;
    margin:0;
    color:var(--wine-900);
  }
  .brand-sub{
    font-size:12.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
    font-family:'Lora', serif;
    margin-top:2px;
  }
  nav.tabs{
    display:flex;gap:8px;margin-bottom:22px;
    background:var(--ok-bg);
    padding:5px;border-radius:14px;
    border:1px solid var(--border);
  }
  nav.tabs button{
    flex:1;border:none;background:transparent;padding:10px 8px;
    font-family:'Fraunces', serif;font-size:14.5px;font-weight:600;
    color:var(--text-muted);border-radius:10px;cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  nav.tabs button.active{
    background:var(--wine-800);color:#F8EFE3;
    box-shadow:var(--shadow);
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px 20px 6px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-family:'Fraunces', serif;
    font-size:18px;font-weight:600;
    margin:0;color:var(--wine-800);
    display:flex;align-items:center;gap:9px;
  }
  .card-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    cursor:pointer;user-select:none;padding:2px 0 4px;margin:0 0 4px;
  }
  .card-head-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .click-hint{
    font-size:11.5px;color:var(--text-muted);opacity:0.55;
    font-style:italic;white-space:nowrap;font-family:'Lora',serif;
  }
  .chevron{
    width:18px;height:18px;color:var(--wine-700);flex:0 0 auto;
    transition:transform .2s ease;
  }
  .chevron.open{transform:rotate(180deg);}
  .card-collapse{display:none;}
  .card-collapse.open{display:block;}
  .card h2 .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:50%;
    background:var(--wine-800);color:#F8EFE3;
    font-size:12px;font-family:'Lora',serif;font-weight:600;
  }
  .card .desc{font-size:13px;color:var(--text-muted);margin:0 0 16px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12.5px;letter-spacing:.3px;
    color:var(--text-muted);margin-bottom:5px;font-family:'Lora',serif;
  }
  .field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
    width:100%;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border);background:#fff;
    font-family:'Lora',serif;font-size:14.5px;color:var(--text);
    outline:none;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--wine-600);
    box-shadow:0 0 0 3px rgba(155,61,74,0.14);
  }
  .field textarea{resize:vertical;min-height:64px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.grid2{grid-template-columns:1fr;}}

  .criterion{border-top:1px dashed var(--border);padding:14px 0;}
  .criterion:first-of-type{border-top:none;padding-top:2px;}
  .crit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .crit-label{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--text);}
  .crit-hint{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
  .note-toggle{
    border:none;background:none;color:var(--gold);cursor:pointer;
    font-size:12px;font-family:'Lora',serif;text-decoration:underline;
    white-space:nowrap;flex:0 0 auto;padding:2px;
  }
  .stamps{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .stamp{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--border);background:#fff;
    border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;
    font-size:12.5px;color:var(--text-muted);font-family:'Lora',serif;
    transition:all .15s ease;
  }
  .stamp .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);flex:0 0 auto;}
  .stamp.selected{font-weight:600;}
  .note-box{display:none;margin-top:10px;}
  .note-box.open{display:block;}
  .note-box input{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);
    font-family:'Lora',serif;font-size:13px;background:#fffdf9;
  }
  .checks{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
  .check{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text);}
  .check input{accent-color:var(--wine-700);width:16px;height:16px;}
  .hint-inline{font-size:12px;color:var(--gold);margin-top:4px;}
  .btn{
    font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;
    border-radius:12px;padding:12px 18px;cursor:pointer;border:1px solid transparent;
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--wine-800);color:#F8EFE3;width:100%;box-shadow:var(--shadow);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--wine-800);}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;}
  .save-bar{margin-top:6px;margin-bottom:40px;}
  .save-hint{font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px;}

  /* saved list */
  .empty{
    text-align:center;padding:60px 20px;color:var(--text-muted);
  }
  .empty .glass-mark{margin:0 auto 14px;opacity:.7;}
  .empty h3{font-family:'Fraunces',serif;color:var(--wine-800);font-size:18px;margin:0 0 6px;}
  .empty p{font-size:13.5px;line-height:1.5;max-width:320px;margin:0 auto;}
  .cata-item{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px 16px;margin-bottom:12px;box-shadow:var(--shadow);
  }
  .cata-item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .cata-tag{
    font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);
    font-family:'Lora',serif;margin-bottom:3px;
  }
  .cata-name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--wine-900);}
  .cata-meta{font-size:12.5px;color:var(--text-muted);margin-top:3px;}
  .cata-actions{display:flex;gap:8px;margin-top:12px;}
  .icon-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:8px 12px;font-size:12.5px;color:var(--wine-800);cursor:pointer;
    font-family:'Lora',serif;font-weight:600;
  }
  .icon-btn.danger{color:#8a4b46;}
  .icon-btn svg{width:14px;height:14px;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(58,20,32,0.55);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg-paper);border-radius:18px;max-width:420px;width:100%;
    padding:22px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .modal img{width:100%;border-radius:12px;border:1px solid var(--border);margin-bottom:14px;}
  .modal-actions{display:flex;gap:10px;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--wine-900);color:#F8EFE3;padding:10px 18px;border-radius:999px;
    font-size:13px;font-family:'Lora',serif;box-shadow:var(--shadow);z-index:60;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
  .req::after{content:' *';color:var(--wine-600);}
  .autosave-status{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--text-muted);font-family:'Lora',serif;
    min-height:18px;margin:-6px 0 14px 2px;transition:opacity .2s ease;
  }
  .autosave-status .adot{
    width:7px;height:7px;border-radius:50%;background:var(--gold);flex:0 0 auto;
  }
  .autosave-status.saved .adot{background:#6E9B5A;}
  .autosave-status.pending .adot{background:var(--gold);animation:pulse 1s infinite ease-in-out;}
  .autosave-status.error .adot{background:#B4453D;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="glass-mark" viewBox="0 0 46 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 3H37L34 27C33 34 28 38 23 38C18 38 13 34 12 27L9 3Z" stroke="#6E1F3A" stroke-width="2" fill="#F8EFE3"/>
      <path id="wineFill" d="M11.3 15H34.7L34 21C33.4 26 29 30 23 30C17 30 12.6 26 12 21L11.3 15Z" fill="#8C2F45"/>
      <line x1="23" y1="38" x2="23" y2="50" stroke="#6E1F3A" stroke-width="2"/>
      <line x1="14" y1="53" x2="32" y2="53" stroke="#6E1F3A" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div>
      <h1 class="brand">Tinta Roja</h1>
      <div class="brand-sub">Planilla de cata</div>
    </div>
  </header>

  <nav class="tabs">
    <button id="tabNueva" class="active">Nueva cata</button>
    <button id="tabMis">Mis catas <span id="misCount"></span></button>
  </nav>

  <div id="autosaveStatus" class="autosave-status"></div>
  <div id="viewNueva"></div>
  <div id="viewMis" style="display:none"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Storage safety net ----------
   Si el almacenamiento persistente no está disponible en este entorno,
   usamos un respaldo en memoria para que guardar nunca falle
   (aunque en ese caso no persista al recargar la página). */
if(typeof window.storage === "undefined" || !window.storage){
  const __mem = {};
  window.storage = {
    async get(key){ return (key in __mem) ? {key, value:__mem[key], shared:false} : null; },
    async set(key, value){ __mem[key] = value; return {key, value, shared:false}; },
    async delete(key){ const existed = key in __mem; delete __mem[key]; return {key, deleted:existed, shared:false}; },
    async list(prefix){ const keys = Object.keys(__mem).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix}; }
  };
}

/* ---------- Config ---------- */
const STAMP_STOPS = ["#E7C3AE","#CF8C6E","#A4445B","#6E1F3A"];
function gradientColor(i, n){
  if(n<=1) return STAMP_STOPS[0];
  const idx = Math.round(i*(STAMP_STOPS.length-1)/(n-1));
  return STAMP_STOPS[idx];
}
function textColorFor(i, n){
  const idx = n<=1 ? 0 : Math.round(i*(STAMP_STOPS.length-1)/(n-1));
  return idx===0 ? "var(--wine-900)" : "#fff";
}

const TIPOS_VINO = ["Tinto","Blanco","Rosado","Espumante","Dulce / Generoso"];
const TEMP_SUGERIDA = {
  "Tinto":"16–18°C",
  "Blanco":"8–12°C",
  "Rosado":"10–12°C",
  "Espumante":"8–12°C",
  "Dulce / Generoso":"8–10°C"
};

const VISUAL_CRITERIA = [
  {key:"limpio", label:"Limpio / Brillante", hint:"", options:["Baja","Media Baja","Alta","Media Alta"]},
  {key:"color", label:"Color / Intensidad", hint:"", options:["Baja","Media Baja","Alta","Media Alta"]},
  {key:"lagrimas", label:"Lágrimas o Piernas", hint:"Indica cuerpo y grado alcohólico.", options:["Ligeras","Densas","Coloreadas"]}
];
const OLFATIVA_CRITERIA = [
  {key:"franqueza", label:"Franqueza", hint:"", options:["Baja","Media Baja","Alta","Media Alta"]},
  {key:"intensidad", label:"Intensidad Aromática", hint:"", options:["Baja","Media Baja","Alta","Media Alta"]},
  {key:"complejidad", label:"Complejidad y Desarrollo", hint:"", options:["Joven","En desarrollo","Evolucionado"]}
];
const GUSTATIVA_CRITERIA_BASE = [
  {key:"ataque", label:"Ataque", hint:"", options:["Seco","Semi seco","Dulce"]},
  {key:"cuerpo", label:"Estructura y Cuerpo", hint:"", options:["Ligero","Medio","Estructurado"]},
  {key:"acidez", label:"Acidez", hint:"", options:["Baja","Media","Alta"]}
];
const TANINOS_CRITERIO = {key:"taninos", label:"Taninos", hint:"", options:["Suaves","Medios","Firmes","Marcados"]};
const GUSTATIVA_CRITERIA_FINAL = [
  {key:"alcohol", label:"Alcohol", hint:"", options:["Bajo","Medio","Alto"]},
  {key:"persistencia", label:"Persistencia (retrogusto)", hint:"", options:["Corta","Media","Larga"]}
];

/* ---------- State ---------- */
function emptyCriterion(){ return {r:null, o:""}; }
function freshState(){
  const today = new Date().toISOString().slice(0,10);
  return {
    cabecera:{catadoPor:"", fecha:today, nombreVino:"", bodega:"", tipoVino:"Tinto", anada:""},
    visual:{ limpio:emptyCriterion(), color:emptyCriterion(), lagrimas:emptyCriterion() },
    olfativa:{ franqueza:emptyCriterion(), intensidad:emptyCriterion(), complejidad:emptyCriterion(),
      aromasDestacables:"" },
    gustativa:{ ataque:emptyCriterion(), cuerpo:emptyCriterion(), acidez:emptyCriterion(),
      taninos:emptyCriterion(), alcohol:emptyCriterion(), persistencia:emptyCriterion(), sensaciones:"" },
    contextual:{ terroir:"", temperatura:"", maridaje:"" },
    comentarios:""
  };
}
let state = freshState();
let openNotes = {}; // key -> bool
let currentDraft = {id:null, numero:null}; // cata en curso para autoguardado

/* ---------- Helpers ---------- */
function get(path){
  return path.split(".").reduce((o,k)=>o&&o[k], state);
}
function set(path, val){
  const parts = path.split(".");
  let o = state;
  for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- Rendering: rating row ---------- */
function renderCriterion(section, c){
  const path = section+"."+c.key;
  const data = get(path);
  const noteId = path+"_note";
  const isOpen = !!openNotes[noteId] || (data.o && data.o.length>0);
  const n = c.options.length;
  return `
  <div class="criterion" data-path="${path}">
    <div class="crit-head">
      <div>
        <div class="crit-label">${esc(c.label)}</div>
        ${c.hint ? `<div class="crit-hint">${esc(c.hint)}</div>` : ""}
      </div>
      <button type="button" class="note-toggle" data-note-toggle="${noteId}">${isOpen ? "ocultar nota" : "+ nota"}</button>
    </div>
    <div class="stamps">
      ${c.options.map((lvl,i) => {
        const color = gradientColor(i,n);
        const textColor = textColorFor(i,n);
        const selected = data.r===lvl;
        const pillStyle = selected ? `background:${color};color:${textColor};border-color:transparent;` : "";
        return `
        <div class="stamp ${selected?'selected':''}" style="${pillStyle}" data-level="${esc(lvl)}" data-set-rating="${path}">
          <span class="dot" style="background:${color}"></span>${esc(lvl)}
        </div>`;
      }).join("")}
    </div>
    <div class="note-box ${isOpen?'open':''}" id="box_${noteId}">
      <input type="text" placeholder="Observación (opcional)" value="${esc(data.o)}" data-set-note="${path}">
    </div>
  </div>`;
}

/* ---------- Collapsible sections ---------- */
let sectionOpen = {datos:true, visual:false, olfativa:false, gustativa:false, terroir:false};
function sectionHeader(key, num, title){
  const open = !!sectionOpen[key];
  return `
    <div class="card-head" data-toggle-section="${key}">
      <h2><span class="num">${num}</span>${esc(title)}</h2>
      <div class="card-head-right">
        ${!open ? '<span class="click-hint">hacer clic para desplegar</span>' : ''}
        <svg class="chevron ${open?'open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>`;
}
function collapseCls(key){ return sectionOpen[key] ? "card-collapse open" : "card-collapse"; }

/* ---------- Render: Nueva cata form ---------- */
function renderNueva(){
  const s = state;
  const showTaninos = s.cabecera.tipoVino === "Tinto";
  const tempPlaceholder = TEMP_SUGERIDA[s.cabecera.tipoVino] || "";

  document.getElementById("viewNueva").innerHTML = `
    <div class="card">
      ${sectionHeader('datos', 1, 'Datos de la cata')}
      <div class="${collapseCls('datos')}">
      <p class="desc">Completá los datos generales del vino y de quien cata.</p>
      <div class="grid2">
        <div class="field"><label>Catado por</label>
          <input type="text" data-bind="cabecera.catadoPor" value="${esc(s.cabecera.catadoPor)}" placeholder="Tu nombre"></div>
        <div class="field"><label>Fecha</label>
          <input type="date" data-bind="cabecera.fecha" value="${esc(s.cabecera.fecha)}"></div>
      </div>
      <div class="field"><label class="req">Nombre del vino</label>
        <input type="text" data-bind="cabecera.nombreVino" value="${esc(s.cabecera.nombreVino)}" placeholder="Ej: Malbec Reserva"></div>
      <div class="grid2">
        <div class="field"><label>Bodega</label>
          <input type="text" data-bind="cabecera.bodega" value="${esc(s.cabecera.bodega)}" placeholder="Ej: Bodega Tinta Roja"></div>
        <div class="field"><label>Añada</label>
          <input type="text" data-bind="cabecera.anada" value="${esc(s.cabecera.anada)}" placeholder="Ej: 2022"></div>
      </div>
      <div class="field"><label>Tipo de vino</label>
        <select data-bind="cabecera.tipoVino">
          ${TIPOS_VINO.map(t=>`<option value="${t}" ${s.cabecera.tipoVino===t?'selected':''}>${t}</option>`).join("")}
        </select>
      </div>
      </div>
    </div>

    <div class="card">
      ${sectionHeader('visual', 2, 'Fase Visual')}
      <div class="${collapseCls('visual')}">
      <p class="desc">Copa incolora sobre fondo blanco y buena iluminación.</p>
      ${VISUAL_CRITERIA.map(c=>renderCriterion("visual", c)).join("")}
      </div>
    </div>

    <div class="card">
      ${sectionHeader('olfativa', 3, 'Fase Olfativa')}
      <div class="${collapseCls('olfativa')}">
      <p class="desc">Primero con la copa detenida y luego agitándola suavemente.</p>
      ${OLFATIVA_CRITERIA.map(c=>renderCriterion("olfativa", c)).join("")}
      <div class="field" style="padding-top:6px;">
        <label>Aromas destacables</label>
        <input type="text" data-bind="olfativa.aromasDestacables" value="${esc(s.olfativa.aromasDestacables)}" placeholder="Ej: frutos rojos, vainilla, cuero...">
      </div>
      </div>
    </div>

    <div class="card">
      ${sectionHeader('gustativa', 4, 'Fase Gustativa')}
      <div class="${collapseCls('gustativa')}">
      <p class="desc">Se confirma en boca lo percibido en nariz y se analiza el equilibrio.</p>
      ${GUSTATIVA_CRITERIA_BASE.map(c=>renderCriterion("gustativa", c)).join("")}

      <div class="grid2">
        <div class="field"><label>Temperatura de servicio</label>
          <input type="text" data-bind="contextual.temperatura" value="${esc(s.contextual.temperatura)}" placeholder="${tempPlaceholder}">
          ${tempPlaceholder ? `<div class="hint-inline">Sugerida para ${s.cabecera.tipoVino}: ${tempPlaceholder}</div>` : ""}
        </div>
        <div class="field"><label>Maridaje sugerido</label>
          <input type="text" data-bind="contextual.maridaje" value="${esc(s.contextual.maridaje)}" placeholder="Ej: carnes rojas"></div>

        <label>Comentarios de la cata</label>

function wireNuevaEvents(){
  const root = document.getElementById("viewNueva");
  root.querySelectorAll("[data-bind]").forEach(el=>{
    el.addEventListener("input", ()=>{
      set(el.getAttribute("data-bind"), el.value);
      if(el.getAttribute("data-bind")==="cabecera.tipoVino"){ renderNueva(); }
      updateSaveHint();
      scheduleAutosave();
    });
    el.addEventListener("change", ()=>{ set(el.getAttribute("data-bind"), el.value); scheduleAutosave(); });
  });
  root.querySelectorAll("[data-bind-check]").forEach(el=>{
    el.addEventListener("change", ()=>{ set(el.getAttribute("data-bind-check"), el.checked); scheduleAutosave(); });
  });
  root.querySelectorAll("[data-set-rating]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const path = el.getAttribute("data-set-rating");
      const lvl = el.getAttribute("data-level");
      const cur = get(path);
      cur.r = (cur.r===lvl)?null:lvl;
      renderNueva();
      updateSaveHint();
      scheduleAutosave();
    });
  });
  root.querySelectorAll("[data-note-toggle]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.getAttribute("data-note-toggle");
      openNotes[id] = !openNotes[id];
      renderNueva();
    });
  });
  root.querySelectorAll("[data-set-note]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const path = el.getAttribute("data-set-note");
      get(path).o = el.value;
      scheduleAutosave();
    });
  });
  root.querySelectorAll("[data-toggle-section]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.getAttribute("data-toggle-section");
      sectionOpen[key] = !sectionOpen[key];
      renderNueva();
    });
  });
  document.getElementById("btnGuardar").addEventListener("click", finalizarCata);
}

function updateSaveHint(){
  const btn = document.getElementById("btnGuardar");
  const hint = document.getElementById("saveHint");
  const ok = !!state.cabecera.nombreVino.trim();
  if(btn) btn.disabled = !ok;
  if(hint) hint.textContent = ok ? "" : "Escribí al menos el nombre del vino: el resto se guarda solo, a tu ritmo.";
}

/* ---------- Autoguardado ---------- */
let autosaveTimer = null;
function scheduleAutosave(){
  renderAutosaveStatus("pending");
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{ ensureSaved().catch(e=>console.error(e)); }, 700);
}

function renderAutosaveStatus(mode){
  const el = document.getElementById("autosaveStatus");
  if(!el) return;
  const nombre = state.cabecera.nombreVino.trim();
  if(!nombre && !currentDraft.id){
    el.className = "autosave-status";
    el.innerHTML = "";
    return;
  }
  if(mode==="pending"){
    el.className = "autosave-status pending";
    el.innerHTML = `<span class="adot"></span> Guardando...`;
  } else if(mode==="error"){
    el.className = "autosave-status error";
    el.innerHTML = `<span class="adot"></span> No se pudo guardar automáticamente`;
  } else {
    el.className = "autosave-status saved";
    el.innerHTML = currentDraft.numero
      ? `<span class="adot"></span> Cata N° ${currentDraft.numero} · guardado automáticamente`
      : "";
  }
}

/* ---------- Storage ---------- */
async function nextCataNumber(){
  try{
    const r = await window.storage.get("cata-counter", false);
    const n = r ? parseInt(r.value,10)+1 : 1;
    await window.storage.set("cata-counter", String(n), false);
    return n;
  }catch(e){
    await window.storage.set("cata-counter", "1", false);
    return 1;
  }
}

/* Guarda (crea o actualiza) la cata en curso. Se llama sola apenas hay
   nombre de vino cargado, y también al finalizar. */
async function ensureSaved(){
  const nombre = state.cabecera.nombreVino.trim();
  if(!nombre) return null;
  try{
    if(!currentDraft.id){
      currentDraft.numero = await nextCataNumber();
      currentDraft.id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    }
    const record = JSON.parse(JSON.stringify(state));
    record.id = currentDraft.id;
    record.numero = currentDraft.numero;
    record.guardadoEn = new Date().toISOString();
    await window.storage.set("cata:"+currentDraft.id, JSON.stringify(record), false);
    renderAutosaveStatus("saved");
    return record;
  }catch(e){
    console.error(e);
    renderAutosaveStatus("error");
    return null;
  }
}

async function finalizarCata(){
  const btn = document.getElementById("btnGuardar");
  btn.disabled = true; btn.textContent = "Guardando...";
  const nombre = state.cabecera.nombreVino.trim();
  if(!nombre){
    showToast("Escribí al menos el nombre del vino para guardar.");
    btn.disabled = false; btn.textContent = "Finalizar cata y empezar otra";
    return;
  }
  clearTimeout(autosaveTimer);
  const record = await ensureSaved();
  if(record){
    showToast("Cata N° "+record.numero+" guardada");
    state = freshState();
    currentDraft = {id:null, numero:null};
    openNotes = {};
    renderNueva();
    await renderMisCatas();
    switchTab("mis");
  } else {
    showToast("No se pudo guardar. Revisá tu conexión e intentá de nuevo.");
    btn.disabled = false;
  }
  btn.textContent = "Finalizar cata y empezar otra";
}

async function listCatas(){
  try{
    const r = await window.storage.list("cata:", false);
    const keys = (r && r.keys) ? r.keys : [];
    const records = [];
    for(const k of keys){
      try{
        const item = await window.storage.get(k, false);
        if(item) records.push(JSON.parse(item.value));
      }catch(e){}
    }
    records.sort((a,b)=> (b.numero||0)-(a.numero||0));
    return records;
  }catch(e){
    return [];
  }
}

async function eliminarCata(id){
  try{
    await window.storage.delete("cata:"+id, false);
    showToast("Cata eliminada");
    await renderMisCatas();
  }catch(e){ showToast("No se pudo eliminar."); }
}

/* ---------- Canvas share image ---------- */
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(" ");
  let line = "";
  let yy = y;
  for(let n=0;n<words.length;n++){
    const test = line + words[n] + " ";
    if(ctx.measureText(test).width > maxWidth && n>0){
      ctx.fillText(line, x, yy);
      line = words[n] + " ";
      yy += lineHeight;
    } else { line = test; }
  }
  ctx.fillText(line, x, yy);
  return yy + lineHeight;
}

function buildCataCanvas(rec){
  const W = 900;
  const bigCanvas = document.createElement("canvas");
  bigCanvas.width = W;
  bigCanvas.height = 2600;
  const ctx = bigCanvas.getContext("2d");

  // background
  ctx.fillStyle = "#F8EFE3";
  ctx.fillRect(0,0,W,bigCanvas.height);

  let y = 56;
  const marginX = 56;
  const contentW = W - marginX*2;

  // header band
  ctx.fillStyle = "#B08D57";
  ctx.font = "600 14px Georgia, serif";
  ctx.fillText("TINTA ROJA · PLANILLA DE CATA", marginX, y);
  y += 40;

  ctx.fillStyle = "#431022";
  ctx.font = "700 40px Georgia, serif";
  ctx.fillText(rec.cabecera.nombreVino || "Sin nombre", marginX, y);
  y += 34;

  ctx.fillStyle = "#8A6B72";
  ctx.font = "italic 18px Georgia, serif";
  const metaLine = [rec.cabecera.bodega, rec.cabecera.anada, rec.cabecera.tipoVino].filter(Boolean).join("  ·  ");
  ctx.fillText(metaLine, marginX, y);
  y += 30;

  ctx.fillStyle = "#8A6B72";
  ctx.font = "16px Georgia, serif";
  ctx.fillText("Cata N° "+rec.numero+"   ·   "+rec.cabecera.fecha+(rec.cabecera.catadoPor?"   ·   Catado por "+rec.cabecera.catadoPor:""), marginX, y);
  y += 26;

  ctx.strokeStyle = "#E4CDB4";
  ctx.beginPath(); ctx.moveTo(marginX,y); ctx.lineTo(W-marginX,y); ctx.stroke();
  y += 38;

  function sectionTitle(t){
    ctx.fillStyle = "#6E1F3A";
    ctx.font = "700 20px Georgia, serif";
    ctx.fillText(t, marginX, y);
    y += 30;
  }
  function critLine(c, data){
    if(!data || (!data.r && !data.o)) return;
    ctx.fillStyle = "#3A1420";
    ctx.font = "600 16px Georgia, serif";
    let str = c.label + (data.r ? "  —  "+data.r : "");
    ctx.fillText(str, marginX, y);
    if(data.r){
      const idx = c.options.indexOf(data.r);
      ctx.fillStyle = gradientColor(idx<0?0:idx, c.options.length);
      ctx.beginPath(); ctx.arc(marginX+contentW-14, y-6, 8, 0, Math.PI*2); ctx.fill();
    }
    y += 24;
    if(data.o){
      ctx.fillStyle = "#8A6B72";
      ctx.font = "italic 14px Georgia, serif";
      y = wrapText(ctx, data.o, marginX+14, y, contentW-14, 19);
      y += 4;
    }
  }
  function textLine(label, val){
    if(!val) return;
    ctx.fillStyle = "#3A1420";
    ctx.font = "600 15px Georgia, serif";
    ctx.fillText(label+":", marginX, y);
    ctx.font = "15px Georgia, serif";
    y = wrapText(ctx, val, marginX+140, y, contentW-140, 20);
    y += 4;
  }

  sectionTitle("Fase Visual");
  VISUAL_CRITERIA.forEach(c=>critLine(c, rec.visual[c.key]));
  y += 14;

  sectionTitle("Fase Olfativa");
  OLFATIVA_CRITERIA.forEach(c=>critLine(c, rec.olfativa[c.key]));
  if(rec.olfativa.aromasDestacables) textLine("Aromas", rec.olfativa.aromasDestacables);
  y += 14;

  sectionTitle("Fase Gustativa");
  GUSTATIVA_CRITERIA_BASE.forEach(c=>critLine(c, rec.gustativa[c.key]));
  if(rec.cabecera.tipoVino==="Tinto") critLine(TANINOS_CRITERIO, rec.gustativa.taninos);
  GUSTATIVA_CRITERIA_FINAL.forEach(c=>critLine(c, rec.gustativa[c.key]));
  if(rec.gustativa.sensaciones) textLine("Sensaciones", rec.gustativa.sensaciones);
  y += 14;

  if(rec.contextual.terroir || rec.contextual.temperatura || rec.contextual.maridaje){
    sectionTitle("Terroir y servicio");
    textLine("Terroir", rec.contextual.terroir);
    textLine("Temperatura", rec.contextual.temperatura);
    textLine("Maridaje", rec.contextual.maridaje);
    y += 14;
  }

  if(rec.comentarios){
    sectionTitle("Comentarios");
    ctx.fillStyle = "#3A1420";
    ctx.font = "italic 16px Georgia, serif";
    y = wrapText(ctx, rec.comentarios, marginX, y, contentW, 22);
  }
  y += 30;

  ctx.strokeStyle = "#E4CDB4";
  ctx.beginPath(); ctx.moveTo(marginX,y); ctx.lineTo(W-marginX,y); ctx.stroke();
  y += 30;
  ctx.fillStyle = "#B08D57";
  ctx.font = "13px Georgia, serif";
  ctx.fillText("Tinta Roja · vinos y más", marginX, y);
  y += 30;

  // crop
  const finalCanvas = document.createElement("canvas");
  finalCanvas.width = W;
  finalCanvas.height = Math.min(y, bigCanvas.height);
  const fctx = finalCanvas.getContext("2d");
  fctx.drawImage(bigCanvas, 0,0,W,finalCanvas.height, 0,0,W,finalCanvas.height);
  return finalCanvas;
}

async function compartirCata(id, records){
  const rec = findRecord(id, records) || findRecord(id, await listCatas());
  if(!rec) return;
  showToast("Generando imagen...");
  const canvas = buildCataCanvas(rec);
  canvas.toBlob(async (blob)=>{
    const filename = "cata-"+rec.numero+"-"+(rec.cabecera.nombreVino||"vino").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".png";
    const file = new File([blob], filename, {type:"image/png"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title:"Cata N° "+rec.numero+" — "+(rec.cabecera.nombreVino||""),
          text:"Cata de "+(rec.cabecera.nombreVino||"vino")+" — Tinta Roja"
        });
        return;
      }catch(e){ /* user cancelled or failed, fall through to preview */ }
    }
    // fallback: show modal with image + download button
    const url = URL.createObjectURL(blob);
    const body = document.getElementById("modalBody");
    body.innerHTML = `
      <div class="cata-tag">Compartir</div>
      <div class="cata-name" style="margin-bottom:12px;">Cata N° ${rec.numero}</div>
      <img src="${url}" alt="Cata">
      <div class="modal-actions">
        <button class="btn btn-ghost btn-sm" id="modalClose2" style="flex:1;">Cerrar</button>
        <a class="btn btn-primary btn-sm" href="${url}" download="${filename}" style="flex:1;text-decoration:none;display:flex;align-items:center;justify-content:center;">Descargar imagen</a>
      </div>
    `;
    document.getElementById("modalOverlay").classList.add("open");
    document.getElementById("modalClose2").addEventListener("click", closeModal);
  }, "image/png");
}

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ---------- Tabs ---------- */
function switchTab(which){
  const isNueva = which==="nueva";
  document.getElementById("tabNueva").classList.toggle("active", isNueva);
  document.getElementById("tabMis").classList.toggle("active", !isNueva);
  document.getElementById("viewNueva").style.display = isNueva ? "block":"none";
  document.getElementById("viewMis").style.display = isNueva ? "none":"block";
  document.getElementById("autosaveStatus").style.display = isNueva ? "flex":"none";
}
document.getElementById("tabNueva").addEventListener("click", ()=>switchTab("nueva"));
document.getElementById("tabMis").addEventListener("click", ()=>{ switchTab("mis"); renderMisCatas(); });

/* ---------- Init ---------- */
renderNueva();
renderMisCatas();
</script>
